<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMTS-Rank Semantic Search</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="overlay"></div>

    <div class="topbar">
        <span id="userGreeting" style="font-size:0.9rem; color: var(--text-muted);"></span>
        <button id="themeToggle" class="secondary-btn" aria-label="Toggle theme" title="Toggle theme" style="font-size:0.8rem; padding: 0.3rem 0.6rem; display:flex; align-items:center; gap:6px;">
            <span id="themeIcon">🌙</span>
        </button>
            <button id="logoutBtn" class="secondary-btn" style="font-size:0.8rem; padding: 0.3rem 0.8rem;">Sign Out</button>
    </div>

    <div class="container">
        <header>
            <h1><span class="gradient-text">BMTS</span> Ranker</h1>
            <p>Optimized Relevance Search for Nigerian Research Innovation</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search algorithms, medical research, agriculture..." autocomplete="off">
                <button id="searchBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            
            <div class="filter-box" style="display: flex; gap: 10px; justify-content: center; margin-top: 15px; margin-bottom: 20px;">
                <select id="startYear" style="max-width: 180px; border-radius: 6px; border: 1px solid var(--border-color, #334155); padding: 0.5rem; background: var(--surface-light, #1e293b); color: var(--text-main, #f8fafc); font-family: inherit;">
                    <option value="">Start Year (Any)</option>
                </select>
                <select id="endYear" style="max-width: 180px; border-radius: 6px; border: 1px solid var(--border-color, #334155); padding: 0.5rem; background: var(--surface-light, #1e293b); color: var(--text-main, #f8fafc); font-family: inherit;">
                    <option value="">End Year (Any)</option>
                </select>
            </div>
            
            <div class="controls">
                <button id="ingestLocalBtn" class="secondary-btn">Ingest Local Folder</button>
                <button id="evaluateBtn" class="secondary-btn" style="border-color: var(--accent); color: var(--accent);">Evaluate System</button>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <div class="results-container" id="resultsContainer">
                <!-- Results injected here -->
                <div class="initial-state">
                    Enter a query to begin searching.
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
